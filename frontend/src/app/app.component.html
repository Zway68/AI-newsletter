<div id="app">
    <div class="glass-bg"></div>
    <main class="container">
        <header>
            <h1>AI Newsletter</h1>
            <p>Personalize your news streams down to the prompt.</p>
            <div *ngIf="!isLoggedIn" class="auth-section">
                <div id="google-signin-btn"></div>
            </div>
            <div *ngIf="isLoggedIn" class="user-info">
                <img *ngIf="picture" [src]="picture" alt="Profile" class="avatar">
                <span>Welcome, {{ name || email }}</span>
                <button (click)="logout()" class="btn outline">Logout</button>
            </div>
        </header>

        <app-subscription-manager *ngIf="isLoggedIn" [idToken]="idToken">
        </app-subscription-manager>
    </main>
</div>
