<div class="card glass-card" [style.animationDelay]="animationDelay">
    <div class="card-header">
        <input [(ngModel)]="subscription.name" placeholder="Subscription Name" class="input raw-title">
        <button (click)="onRemove()" class="close-btn">&times;</button>
    </div>
    <div class="form-group">
        <label>Prompt Focus</label>
        <textarea [(ngModel)]="subscription.prompt" rows="3" placeholder="e.g. AI safety and latest LLMs"
            class="input"></textarea>
    </div>
    <div class="form-group">
        <label>Frequency</label>
        <select [(ngModel)]="subscription.frequency" class="input">
            <option value="DAILY">Daily</option>
            <option value="WEEKLY">Weekly</option>
            <option value="MONTHLY">Monthly</option>
        </select>
    </div>
</div>
